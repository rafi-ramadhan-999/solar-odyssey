<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Odyssey</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hint">Ketuk planet utk lihat info</div>
<button id="btnMain">🎮 Misi</button>
<button id="btnKec">1×</button>
<button id="btnMusik">🔇</button>
<button id="btnKapal">🚀</button>
<button id="btnFoto" title="Foto pemandangan">📸</button>
<button id="btnKacau" title="Acak-acak planet">🌀</button>
<div id="menuKacau">
  <button id="bGrav">🌀 Gravitasi Liar</button>
  <button id="bLubang">🕳️ Taruh Lubang Hitam</button>
  <button id="bPulih">♻️ Pulihkan</button>
  <label id="kKuatLabel" for="kKuat">Kekuatan: 1.0×</label>
  <input type="range" id="kKuat" min="0.5" max="3" step="0.1" value="1">
</div>
<div id="fotoModal">
  <img id="fotoImg" alt="Foto tata surya">
  <div id="fotoAksi">
    <a id="fotoUnduh" class="fBtn">⬇ Unduh</a>
    <button id="fotoBagi" class="fBtn" style="display:none">↗ Bagikan</button>
    <button id="fotoTutup" class="fBtn sek">Tutup</button>
  </div>
</div>

<div id="kapalUI" style="display:none">
  <div id="stick"><div id="knob"></div></div>
  <div id="kKiri">
    <button id="lurus" class="kKecil">⟲ LURUS</button>
    <button id="kamera" class="kKecil">📷</button>
  </div>
  <div id="kKanan">
    <button id="boost" class="kBtn kSedang">BOOST</button>
    <button id="auto" class="kBtn kSedang">AUTO</button>
    <button id="rem" class="kBtn">REM</button>
    <button id="gas" class="kBtn">GAS</button>
  </div>
  <div id="laju">0%</div>
</div>
<div id="game">
  <div id="gStat"></div>
  <div id="gClue"></div>
  <div id="gMsg"></div>
  <button id="gLanjut" style="display:none"></button>
  <button id="gKeluar" class="sekunder">Keluar</button>
</div>
<div id="panel">
  <h2 id="pNama"></h2>
  <div class="baris" id="pJarak"></div>
  <div class="baris" id="pDiameter"></div>
  <div class="baris" id="pTahun"></div>
  <div class="fakta" id="pFakta"></div>
  <button id="pTutup">Lihat semua</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/scene.js"></script>
<script src="js/sun.js"></script>
<script src="js/helpers.js"></script>
<script src="js/planets.js"></script>
<script src="js/kuiper-comet.js"></script>
<script src="js/spaceship.js"></script>
<script src="js/interaction.js"></script>
<script src="js/music.js"></script>
<script src="js/quiz.js"></script>
<script src="js/extras.js"></script>
<script src="js/foto.js"></script>
<script src="js/kacau.js"></script>
<script src="js/main.js"></script>
</body>
</html>
